# E26: GatedCtx on the P3 neck output -- the repo's OWN NPU-native attention.
#
# `mmsc_modules.GatedCtx` exists precisely because PSABlock's spatial
# self-attention lowers to MatMul + Softmax + Transpose, which rknn-toolkit2 1.6
# cannot schedule on the NPU (board profile: 127.7 ms across 19 CPU op calls,
# 43% of the frame).  It is included here as the backup candidate for the same
# question E25 (SE) asks: "does cheap attention on the small-object level help,
# and can it be deployed?"
#
# MANDATORY pre-check for every arm (learned the hard way with EMA, 2026-09-22):
#   export the head-raw ONNX and run audit_onnx_ops.py BEFORE training.
#   EMA looked like "1x1 + group-norm + sigmoid" but its graph contains
#   InstanceNormalization + MatMul + Softmax + Transpose -> CPU fallback.

nc: 1
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]      # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]      # 4
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, C2f, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11
  - [-1, 3, C2f, [512]]                          # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14
  - [-1, 3, C2f, [256]]                          # 15 (P3/8)
  - [-1, 1, GatedCtx, [64]]                      # 16  (P3/8 has 64 ch at width 0.25)
  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 12], 1, Concat, [1]]                   # 18
  - [-1, 3, C2f, [512]]                          # 19 (P4/16)
  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 9], 1, Concat, [1]]                    # 21
  - [-1, 3, C2f, [1024]]                         # 22 (P5/32)
  - [[16, 19, 22], 1, Detect, [nc]]
